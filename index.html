<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="leftSide">
      <div class="logoContainer">
        <div class="logo">
          <img class="odinLogo" src="odin-lined.png" alt="odin logo" />
          <span class="odinText">ODIN</span>
        </div>
      </div>

      <footer>
        Photo by
        <a
          href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Halie West</a
        >
        on
        <a
          href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Unsplash</a
        >
      </footer>
    </div>

    <div class="rightSide">
      <div class="rightContent">
        <div class="pitch">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your depest dreams.<br />
            Sign up <i>now</i> to get started.
          </p>
          <p>You <i>know</i> you want to.</p>
        </div>

        <div class="formSection">
          <div class="formContainer">
            <h3>Let's do this!</h3>
            <form method="get">
              <label
                >FIRST NAME<input type="text" name="first-name" required
              /></label>
              <label
                >LAST NAME<input type="text" name="last-name" required
              /></label>
              <label>EMAIL<input type="email" name="email" required /></label>
              <label
                >PHONE NUMBER
                <input type="tel" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" required
              /></label>
              <label>PASSWORD <input type="password" required /></label>
              <label>CONFIRM PASSWORD <input type="password" required /></label>
            </form>
          </div>
        </div>

        <button type="submit">Create Account</button>
        <p class="login">Already have an account? <span>Log in</span></p>
      </div>
    </div>
  </body>
</html>
