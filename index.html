<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="leftSide">
      <div class="logoContainer">
        <div class="logo">
          <img class="odinLogo" src="odin-lined.png" alt="odin logo" />
          <span class="odinText">ODIN</span>
        </div>

        <div class="attribution">
          Photo by
          <a
            href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Halie West</a
          >
          on
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Unsplash</a
          >
        </div>
      </div>
    </div>

    <div class="rightSide">
      <div class="rightContent">
        <div class="pitch">
          <pre>
This is not a real online service! You know you need something like this in your life to help you realize your depest dreams.
	Sign up <i>now</i> to get started.</pre>
          <p>You <i>know</i> you want to.</p>
        </div>

        <div class="form-section">
          <h2>Let's do this!</h2>
          <form>
            <label>FIRST NAME<input type="text" name="first-name" /></label>
            <label>LAST NAME<input type="text" name="last-name" /></label>
            <label>EMAIL<input type="email" name="email" /></label>
            <label>PHONE NUMBER <input type="tel" /></label>
            <label>PASSWORD <input type="password" /></label>
            <label>CONFIRM PASSWORD <input type="password" /></label>
          </form>
        </div>
        <button type="submit">Create Account</button>
        <p class="login">Already have an account? <span>Log in</span></p>
      </div>
    </div>
  </body>
</html>
